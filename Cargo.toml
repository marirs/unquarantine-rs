[package]
name = "unquarantine"
version = "0.3.0"
authors = ["Marirs <marirs@gmail.com>"]
description = "Unquarantine/decrypt/extract quarantined files from ~40 AV products."
keywords = ["unquarantine", "quarantine", "malware", "forensics"]
categories = ["parsing", "cryptography"]
license = "MIT"
repository = "https://github.com/marirs/unquarantine-rs"
readme = "README.md"
exclude = ["data", ".github"]
edition = "2024"
rust-version = "1.85"

[dependencies]
# Library deps are pure-Rust and free of C/-sys crates.
base64 = "0.22.1"
blowfish = "0.10"
cfb = "0.14"
cipher = "0.5"
crc = "3.4"
md-5 = "0.11"
miniz_oxide = "0.9"
regex = "1.12"
thiserror = "2.0.18"
# default-features = false keeps zip pure-Rust (drops bzip2-sys / zstd-sys /
# lzma); `deflate` uses the miniz_oxide backend. Traditional ZipCrypto
# decryption is always available and needs no feature.
zip = { version = "8", default-features = false, features = ["deflate"] }

# CLI-only; pulled in solely by the `unquarantine` binary via the `cli` feature.
clap = { version = "4", features = ["derive"], optional = true }

[features]
default = []
cli = ["dep:clap"]

[lib]
name = "unquarantine"
path = "src/lib.rs"

[[bin]]
name = "unquarantine"
path = "src/main.rs"
required-features = ["cli"]

[profile.dev]
opt-level = 3

[profile.release]
codegen-units = 1
debug-assertions = false
debug = false
opt-level = 3
lto = true
